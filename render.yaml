services:
  - type: web
    name: excel-insights
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn portal.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
